# ═══════════════════════════════════════════════════════════════════════════════
# PyCrypt - Release Workflow
# ═══════════════════════════════════════════════════════════════════════════════
#
# This workflow automatically publishes to PyPI when you push a version tag.
#
# Usage:
#   git tag v1.0.0
#   git push origin v1.0.0
#
# Prerequisites:
#   1. Create PyPI account
#   2. Create API token on PyPI
#   3. Add PYPI_API_TOKEN secret in GitHub repository settings
#
# Made with ❤️ from Claude AI
# ═══════════════════════════════════════════════════════════════════════════════

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

  release:
    name: Build and Publish
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: PyCrypt ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## 🔐 PyCrypt ${{ steps.get_version.outputs.VERSION }}
            
            Jasypt-like encryption library for Python.
            
            ---
            
            ### 📦 Installation
            
            ```bash
            pip install pycrypt-jasypt==${{ steps.get_version.outputs.VERSION }}
            ```
            
            Or upgrade:
            ```bash
            pip install --upgrade pycrypt-jasypt
            ```
            
            ---
            
            ### 📝 What's Changed
            
            See [CHANGELOG.md](CHANGELOG.md) for details.
            
            ---
            
            Made with ❤️ from Claude AI for Python developers who need Jasypt
          files: |
            dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
